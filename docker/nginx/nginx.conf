server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    # 👇 Proxy all /api/ requests to uvicorn running on the host
    location /api/ {
        proxy_pass http://168.231.66.254:8080/;  # Use the host's IP address and port where uvicorn is running
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestion des fichiers statiques (static files for Symfony)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Traiter les requêtes PHP (handle PHP requests with FastCGI)
    location ~ ^/index.php(/|$) {
        fastcgi_pass php-fpm:9000;  # Connect to the PHP service via port 9000
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
        client_max_body_size 200M;
        fastcgi_read_timeout 600;
    }

    # Logs d'erreurs (error logs)
    error_log /var/log/nginx/symfony_error.log;
    access_log /var/log/nginx/symfony_access.log;

    # Empêcher l'accès direct aux fichiers sensibles (block hidden files)
    location ~ ^/\. {
        deny all;
    }
}
